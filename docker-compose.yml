services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: covid_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - API_KEY=${API_KEY:?Renseigner API_KEY dans le fichier .env}
      # Le modèle servi est celui qui porte l'alias "production" dans le registre
      - MODEL_SOURCE=registry
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_HTTP_REQUEST_MAX_RETRIES=2
      - MLFLOW_HTTP_REQUEST_TIMEOUT=10
    volumes:
      - ./models:/app/models
      - ./data/monitoring:/app/data/monitoring
    depends_on:
      mlflow:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: covid_mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Stockage objet compatible S3 : c'est le stockage distant de DVC
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: covid_minio
    # L'image tourne sans privilèges : root est nécessaire pour écrire dans le volume
    user: "0:0"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address :9001

  # Crée le bucket « dvc » au premier démarrage, puis s'arrête
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: covid_minio_init
    depends_on:
      - minio
    environment:
      - MC_HOST_stockage=http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
    command: mb --ignore-existing stockage/dvc
    restart: on-failure

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: covid_airflow_webserver
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - API_KEY=${API_KEY:?Renseigner API_KEY dans le fichier .env}
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Saadia
      --lastname MLOps
      --role Admin
      --email admin@example.com || true &&
      airflow webserver
      "

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: covid_airflow_scheduler
    depends_on:
      airflow-webserver:
        condition: service_started
      mlflow:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - API_KEY=${API_KEY:?Renseigner API_KEY dans le fichier .env}
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: airflow scheduler

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: covid_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    depends_on:
      - api
      - alertmanager

  # Reçoit les alertes de Prometheus, les regroupe et les achemine
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    container_name: covid_alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro

  grafana:
    image: grafana/grafana:10.4.2
    container_name: covid_grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  airflow_home:
  minio_data:

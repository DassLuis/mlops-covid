services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: covid_api
    ports:
      - "8000:8000"
    environment:
      - API_KEY=mlops-covid-secret-key
    volumes:
      - ./models:/app/models
    depends_on:
      - mlflow

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: covid_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: covid_airflow_webserver
    depends_on:
      - mlflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Saadia
      --lastname MLOps
      --role Admin
      --email admin@example.com || true &&
      airflow webserver
      "

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: covid_airflow_scheduler
    depends_on:
      - airflow-webserver
      - mlflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: airflow scheduler

volumes:
  airflow_home: